- name: Checks kaniko-secret secret exists
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: '{{ kaniko.secret_name }}'
    namespace: '{{ namespace }}'
  register: kaniko_secret_name_exists

- name: Create kaniko secret
  shell: 'kubectl create secret generic {{ kaniko.secret_name }} --from-file=settings.xml=./config.json --namespace {{ namespace }}'
  when: mvn_settings_exists.resources | length == 0

